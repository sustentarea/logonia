on:
  push:
    branches: main
    paths:
      - nlogox/**

name: check-netlogo.yaml
permissions: read-all

jobs:
  check-netlogo:
    if: "!contains(github.event.head_commit.message, '[skip check-netlogo]')"
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, version: 'release'}
          - {os: macos-latest, version: 'release'}
          - {os: ubuntu-latest, version: 'release'}
    name: "${{ matrix.config.os }} (${{ matrix.config.version }})"
    runs-on: ${{ matrix.config.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions: read-all
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up NetLogo
        uses: danielvartan/netlogo-actions/setup-netlogo@v1
        with:
          version: ${{ matrix.config.version }}
          cache: 'true'

      - name: Check NetLogo models
        uses: danielvartan/netlogo-actions/check-netlogo@v1
