meta:
  name: "Logônia: Plant Growth Response Model in NetLogo"
  link:
    home: "https://github.com/sustentarea/logonia"
    github: "https://github.com/sustentarea/logonia"
    comses: "https://www.comses.net/codebases/4f2be13a-3957-4537-bf64-3fad96ba271f"
    osf: "https://doi.org/10.17605/OSF.IO/TPY7S"
  description: >-
    Logônia is a NetLogo model that simulates the growth response of a
    fictional plant, Logônia, under different climatic conditions. The model
    uses climate data from WorldClim 2.1 and demonstrates how to integrate the
    LogoClim model through the LevelSpace extension.

logo:
  images:
    logo:
      path: "images/logo.png"
      alt: "Logo"
    og-image:
      path: "images/og-image.png"
      alt: "Open Graph Image"
  small: "logo"
  medium: "logo"
  large: "logo"

color:
  palette:
    lime: "#2cd13b" # NetLogo: lime (65)
    lime-green: "#57af3a" # NetLogo: green - 0.1 (54.9)
    olive: "#52a537" # NetLogo: green - 0.4 (54.6)
    olive-brown: "#84841b" # NetLogo: yellow - 2.3 (42.7)
    brown: "#9d6e48" # NetLogo: brown (35)
    white: "#FFFFFF" # NetLogo: white (9.9)
    gray: "#8d8d8d" # NetLogo: gray (5)
    light-gray: "#e8e8e8" # NetLogo: gray + 4 (9)
    black: "#000000"
  background: "white"
  primary: "lime"
  secondary: "olive-brown"
  tertiary: "brown"
  success: "lime"
  info: "lime-green"
  warning: "olive-brown"
  danger: "brown"
  light: "white"
  dark: "black"

typography:
  fonts:
    - family: "Poppins"
      source: "google"
      weight: [100, 200, 300, 400, 500, 600, 700, 800, 900]
    - family: "DM Mono"
      source: "google"
      weight: [300, 400, 500]
  base:
    family: "Poppins"
    line-height: 1.5
    weight: "normal"
  headings:
    family: "Poppins"
    color: "brown"
    weight: "bold"
  monospace: "DM Mono"
  monospace-inline:
    color: "lime"
    background-color: "light-gray"
  monospace-block:
    background-color: "light-gray"
  link:
    color: "lime"
    decoration: "underline"
